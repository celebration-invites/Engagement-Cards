<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3e8ce">
  <title>Engagement Invitation | Deepak C S &amp; Kumuda M</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f6e2c4; }
    body { display: flex; justify-content: center; }
    .invitation { position: relative; width: min(100vw, 683px); line-height: 0; }
    .invitation img { display: block; width: 100%; height: auto; }
    /* Tap area = the "Tap for Location" button (from the original PDF link), padded slightly above/below for easier tapping */
    .map-hotspot {
      position: absolute;
      left: 26.85%;
      top: 47.64%;
      width: 46.76%;
      height: 5.8%;
      display: block;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .map-hotspot:focus-visible {
      outline: 3px solid #8b173d;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="invitation" aria-label="Engagement invitation">
    <img src="deepak.webp"
         alt="Engagement ceremony invitation for Deepak C S and Kumuda M, 13 December, 10.00 AM onwards, New Swathi Grand Mathikere, Bengaluru"
         width="940" height="1673">
    <a class="map-hotspot"
       href="https://maps.app.goo.gl/stMFMafMd9LNkvcn6?g_st=aw"
       target="_blank" rel="noopener noreferrer"
       aria-label="Open New Swathi Grand Mathikere in Google Maps"
       title="Open location in Google Maps"></a>
  </main>
</body>
</html>
